# 笔记自动化测试 — note_meeting 元素定位
# 5 个元素

elements:
  会议笔记.进入会议笔记:
    locator: [xpath, 会议笔记]
    operation: 从创建菜单选择会议笔记
    desc: 创建二级菜单中的"会议笔记"选项
    index: 0
  会议笔记.会议笔记同步提示1:
    locator: [xpath, 仅支持向V3.5.4及以上版本同步]
    operation: 会议笔记同步限制提示1
    desc: 首次进入会议笔记的同步限制说明1
    index: 0
  会议笔记.会议笔记导出提示2:
    locator: [xpath, 请在录音或转写文字完成后，再使用导出功能]
    operation: 会议笔记导出限制提示2
    desc: 首次进入会议笔记的导出限制说明2
    index: 0
  会议笔记.会议笔记提示确认:
    locator: [xpath, 知道了]
    operation: 确认会议笔记提示
    desc: 会议笔记提示弹窗的确认按钮
    index: 0
  会议笔记.会议笔记退出按钮:
    locator: [id, 'com.onyx.android.note:id/back_icon']
    operation: 退出会议笔记
    desc: 会议笔记页面的返回按钮
    index: 0

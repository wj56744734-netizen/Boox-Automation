# 笔记自动化测试 — note_text 元素定位
# 5 个元素

elements:
  文本笔记.进入文本笔记:
    locator: [xpath, 文本笔记]
    operation: 从创建菜单选择文本笔记
    desc: 创建二级菜单中的"文本笔记"选项
    index: 0
  文本笔记.文本笔记创建按钮:
    locator: [xpath, 创建]
    operation: 在文本笔记创建页点击创建
    desc: 文本笔记创建页面的确认按钮
    index: 0
  文本笔记.文本笔记同步提示:
    locator: [xpath, 文本笔记不支持向V3.3.1或更低版本同步]
    operation: 文本笔记同步限制提示文本
    desc: 首次进入文本笔记的同步限制说明
    index: 0
  文本笔记.文本笔记提示确认:
    locator: [xpath, 确定]
    operation: 确认文本笔记同步提示
    desc: 文本笔记提示弹窗的确认按钮
    index: 0
  文本笔记.文本笔记退出按钮:
    locator: [id, 'com.onyx.android.note:id/quit']
    operation: 退出文本笔记
    desc: 文本笔记页面的退出按钮
    index: 0

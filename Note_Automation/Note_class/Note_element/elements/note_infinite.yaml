# 笔记自动化测试 — note_infinite 元素定位
# 8 个元素

elements:
  无界笔记.进入无界笔记:
    locator: [xpath, 无边笔记]
    operation: 从创建菜单选择无界笔记
    desc: 创建二级菜单中的"无边笔记"选项（代码中写为"无边笔记"）
    index: 0
  无界笔记.无界笔记创建按钮:
    locator: [xpath, 创建]
    operation: 在无界笔记创建页点击创建
    desc: 无界笔记创建页面的确认按钮
    index: 0
  无界笔记.无界笔记退出按钮:
    locator: [id, 'com.onyx.android.note:id/back_icon']
    operation: 退出无界笔记
    desc: 无界笔记页面的返回按钮
    index: 0
  无界笔记.模板-点阵:
    locator: [xpath, 点阵]
    operation: 选择点阵模板
    desc: 无界笔记模板列表中的点阵模板
    index: 0
  无界笔记.模板尺寸-大:
    locator: [xpath, 大]
    operation: 校验模板尺寸大
    desc: 点阵模板尺寸选项-大
    index: 0
  无界笔记.模板尺寸-中:
    locator: [xpath, 中]
    operation: 校验模板尺寸中
    desc: 点阵模板尺寸选项-中
    index: 0
  无界笔记.模板尺寸-小:
    locator: [xpath, 小]
    operation: 校验模板尺寸小
    desc: 点阵模板尺寸选项-小
    index: 0
  无界笔记.已选模板-点阵:
    locator: [xpath, 已选：点阵]
    operation: 校验已选点阵模板
    desc: 创建前校验当前已选模板为点阵
    index: 0

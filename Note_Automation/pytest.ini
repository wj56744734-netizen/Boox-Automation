[pytest]
; 统一日志配置 - 实时输出 + 自定义格式
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] | %(funcName)s | %(filename)s:%(lineno)d | %(message)s
log_cli_date_format = %H:%M:%S

; 日志文件配置（需要创建 logs 目录后启用）
; log_file = logs/test.log
; log_file_level = DEBUG
; log_file_format = %(asctime)s [%(levelname)s] | %(name)s | %(funcName)s | %(message)s
; log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    test: 自定义的通用测试标记说明
    china: 与国内相关功能测试的标记说明
    abroad: 与国外相关功能测试的标记说明
    increment: 与增量用例相关功能测试的标记说明
    full_amount: 与全量用例相关功能测试的标记说明
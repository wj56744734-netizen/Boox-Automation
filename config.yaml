# ============================================================
# Note_Automation 配置文件
# 
# 使用说明：
# 1. 所有配置都有默认值，可根据需要覆盖
# 2. 支持点号路径访问：Config.get('timeout.default')
# 3. 配置文件使用 YAML 格式
# 4. 用户配置会与默认配置深度合并（只覆盖你指定的项）
#
# 影响范围标注：
#   [全局]      = 影响所有操作，需谨慎调整
#   [单个方法]  = 只影响特定方法
#   [特定场景]  = 只在特定场景下生效
# ============================================================

# ==================== 超时配置 ====================
timeout:
  # 【影响范围】全局 - 所有元素等待的默认超时时间
  # 调整建议：
  #   - 网络慢/App响应慢 → 调大（如 10）
  #   - 追求测试速度 → 调小（如 3）
  #   - 仅影响未指定 timeout 的方法调用
  default: 5              # 单位：秒

  # 【影响范围】wait_for_press_name、_safe_long_press
  # 调整建议：
  #   - App长按响应慢 → 调大（如 3000）
  #   - 长按菜单弹出慢 → 调大
  # 注意：此值为毫秒，不要与 default 混淆
  long_press: 2000        # 单位：毫秒

  # 【影响范围】click_slice（屏幕滑动操作）
  # 调整建议：
  #   - 滑动太快导致操作失败 → 调大（如 500）
  #   - 追求速度 → 调小（如 200）
  swipe: 300              # 单位：毫秒

  # 【影响范围】wait_input_box（输入框操作）
  # 调整建议：
  #   - 键盘收起慢 → 调大（如 2）
  #   - 通常不需要调整
  keyboard_hide: 1        # 单位：秒

# ==================== 重试配置 ====================
retry:
  # 【影响范围】retry_and_handle_exceptions 装饰器
  # 调整建议：
  #   - 元素经常延迟出现 → 调大（如 5）
  #   - 追求测试速度 → 调小（如 2）
  #   - 设为 1 可完全禁用重试
  max_attempts: 3         # 单位：次

  # 【影响范围】retry_and_handle_exceptions 装饰器
  # 调整建议：
  #   - App响应慢 → 调大（如 2）
  #   - 追求测试速度 → 调小（如 0.5）
  delay: 1.5                # 单位：秒

  # 【影响范围】_safe_click、_safe_long_press
  # 调整建议：
  #   - 页面经常刷新导致元素过时 → 调大（如 3）
  #   - 页面稳定 → 调小（如 1）
  #   - 设为 1 可禁用 StaleElement 重试
  element_click: 2        # 单位：次

# ==================== 截图配置 ====================
screenshot:
  # 【影响范围】失败截图保存目录
  # 调整建议：
  #   - 统一保存到项目根目录 Test_report/screenshots/
  #   - 每日自动清理超过1天的截图
  dir: 'Test_report/screenshots'

  # 【影响范围】失败截图文件名
  # 调整建议：
  #   - 中文环境 → '失败'
  #   - 英文环境 → 'failed'
  prefix: '失败'

  # 【影响范围】所有失败场景（装饰器、Toast检测）
  # 调整建议：
  #   - 调试时 → true（保留截图便于分析）
  #   - 正式环境 → false（减少IO开销）
  enabled: true

# ==================== Toast 检测配置 ====================
toast:
  # 【影响范围】wait_check_toast
  # 调整建议：
  #   - Toast显示慢 → 调大（如 10）
  #   - Toast显示快 → 调小（如 3）
  timeout: 5              # 单位：秒

  # 【影响范围】wait_check_toast（同步模式）
  # 调整建议：
  #   - Toast不稳定 → 调大（如 5）
  #   - Toast稳定 → 调小（如 2）
  retry: 3                # 单位：次

  # 【影响范围】wait_check_toast（同步模式）
  # 调整建议：
  #   - 设备慢 → 调大（如 1）
  #   - 追求速度 → 调小（如 0.2）
  retry_delay: 0.5        # 单位：秒

# ==================== 项目配置 ====================
project:
  # 【影响范围】主要用于日志和报告
  name: 'Note_Automation'

  # 【影响范围】失败截图、装饰器降级逻辑
  # 注意：这是 fallback 方案，正常情况从实例获取 driver
  driver_import_path: 'Note_Automation.config.driver'

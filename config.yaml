# ============================================================
# boox_automation 配置文件
#
# 环境变量优先级 > 配置文件，详见各段注释
# ============================================================

# ==================== 超时配置 ====================
timeout:
  # 元素查找默认超时，所有未显式指定 timeout 的方法共用
  default: 5              # 秒

  # C列XML对比前等待预期元素就位的超时
  xml_element_wait: 5     # 秒

  # 被测应用冷启动超时（从 adb shell am start 到首页可见）
  app_launch: 30          # 秒

# ==================== 重试配置 ====================
retry:
  # retry_and_handle_exceptions 装饰器最大重试次数，设为 1 禁用重试
  max_attempts: 1         # 次

  # 两次重试之间的等待间隔
  delay: 1.5              # 秒

  # _safe_click / _safe_long_press 的 StaleElement 重试次数
  element_click: 2        # 次

  # StaleElement 重试前等待时间
  stale_element_delay: 0.5  # 秒

# ==================== Appium 配置 ====================
appium:
  # Appium Server 地址，环境变量 APPIUM_HOST / APPIUM_PORT 可覆盖
  host: "127.0.0.1"
  port: 4723

  # 自动拉起 Appium 时的启动等待超时
  startup_timeout: 15     # 秒

  # 创建 Session 时传入的 W3C capabilities
  capabilities:
    platformName: Android
    automationName: UiAutomator2
    newCommandTimeout: 3600    # 秒，无命令自动退出 session
    adbExecTimeout: 120000     # 毫秒，ADB 命令执行超时

# ==================== ADB 配置 ====================
adb:
  # 等待设备就绪（已连接 + 可响应 ADB 命令）的最大尝试次数和间隔
  device_ready_retries: 5   # 次
  device_ready_delay: 2     # 秒

  # 普通 ADB 命令失败后的重试次数和间隔
  command_retries: 3        # 次
  command_delay: 2          # 秒

  # ADB命令 sheet 中命令的执行超时
  command_timeout: 10       # 秒

  # 应用数据清理命令（由前置条件【清理应用数据】触发）
  cleanup:
    app_data:
      packages:               # pm clear 目标包名
        - com.onyx.android.note
        - com.onyx.android.ksync
        - com.onyx
    storage_files:            # rm -rf 目标路径
      paths:
        - /sdcard/note/*

# ==================== Excel / 用例配置 ====================
excel:
  # --- 数据源 ---
  # 用例和元素的加载方式: cloud | cache | local
  #   cloud — 仅从飞书云端加载，失败直接报错
  #   cache — 仅从本地缓存加载，无缓存直接报错
  #   local — 仅从本地路径加载，文件不存在直接报错
  # 环境变量 NOTE_EXCEL_SOURCE 可覆盖
  source: "cloud"

  # --- 用例 ---
  # 要加载的用例 Sheet 名列表，云端/本地共用
  # 环境变量 NOTE_TEST_CASE_SHEETS 可覆盖（逗号分隔）
  test_case_sheets:
    - "笔记"
  # - "设置"    ← 后续模块结构对齐后取消注释即可

  # 优先级筛选：P0=仅P0  P1=P1+P2  P2=仅P2  test=仅test  空=全部
  priority_filter: "test"  # 环境变量 NOTE_TEST_PRIORITY 可覆盖

  # 模块筛选：逗号分隔，仅运行 C 列匹配的模块。空=全部
  # 环境变量 NOTE_TEST_MODULES 可覆盖（逗号分隔）
  test_modules: ""

  # 本地用例文件路径（仅 source=local 时生效）
  # 支持相对路径（相对于项目根目录）或绝对路径
  # 环境变量 NOTE_TEST_CASE_PATH 可覆盖
  test_case_path: "/Users/xiaoyu/Automation_projects/boox-automation/boox_automation/data/test_cases.xlsx"

  # --- 元素 ---
  # 本地元素文件路径（仅 source=local 时生效）
  # 环境变量 NOTE_ELEMENTS_PATH 可覆盖
  elements_path: "/Users/xiaoyu/Automation_projects/boox-automation/boox_automation/data/elements.xlsx"

  # 用例表列索引（0-based）
  columns:
    title: 4          # E  标题
    priority: 5       # F  优先级
    module: 2         # C  所属模块
    precondition: 6   # G  前置条件
    steps: 7          # H  操作步骤
    expected: 8       # I  预期结果
    result: 9         # J  测试结果
    remark: 11        # L  测试备注

# ==================== 飞书配置 ====================
feishu:
  # 飞书自建应用凭证，用于获取 tenant_access_token
  # 环境变量 FEISHU_APP_ID / FEISHU_APP_SECRET 可覆盖
  app_id: "cli_a94cb2b1b1f81cb1"
  app_secret: "64CPVsf3cQmW4Af7iyq7jhR2ssz8pEgd"

  # --- 用例电子表格 ---
  # 直接填飞书表格 URL 或纯 token 均可，程序会自动提取
  # 环境变量 FEISHU_TEST_CASE_TOKEN 可覆盖
  test_case_token: "https://s07005grio.feishu.cn/sheets/IXywsB0xehetnKtVrEJc2ZkxnSd"

  # --- 元素电子表格 ---
  # 同用例，填 URL 或纯 token 均可
  # 环境变量 FEISHU_ELEMENTS_TOKEN 可覆盖
  elements_token: "https://s07005grio.feishu.cn/sheets/LjYzsLHSOh3xyItZ7TLcqnqvn3e?sheet=0dVwPT"
  # 元素 sheet 按模块名筛选，与 test_case_sheets 保持一致
  # 始终自动加载"通用"模块（无需手动配置）

  # --- 测试报告推送 ---
  report:
    # 是否启用飞书报告推送（true/false）
    enabled: false

    # 飞书群聊 ID，用于发送测试报告通知
    # 环境变量 FEISHU_CHAT_ID 可覆盖
    chat_id: "oc_126bbbf208297b96a323413ffeaef1d8"

  # --- 通用 ---
  # curl 调用飞书 API 的超时时间
  curl_timeout: 15        # 秒

  # tenant_access_token 缓存时长（有效期 2h，缓存 1.5h 提前刷新）
  token_cache_ttl: 5400   # 秒

# ==================== 日志捕获配置 ====================
logcat:
  # 单次日志捕获最大等待时间（性能测试中抓取特定 log tag 用）
  capture_timeout: 80     # 秒

# ==================== 坐标点击配置 ====================
coord:
  # 带验证的坐标点击最多重试次数（验证不通过则重击）
  max_tap_retries: 3      # 次

  # 重击前等待间隔
  tap_retry_delay: 0.5    # 秒

  # 单次验证超时
  verify_timeout: 5       # 秒

# ==================== Toast 检测配置 ====================
toast:
  # Toast 文本匹配超时
  timeout: 5              # 秒

  # Toast 检测重试次数（同步模式）
  retry: 3                # 次

  # Toast 重试间隔
  retry_delay: 0.5        # 秒

# ==================== 产物清理配置 ====================
cleanup:
  # 每类产物（截图/报告/日志）保留最近 N 轮，超出自动删除
  # 环境变量 NOTE_ARTIFACTS_KEEP_LATEST 可覆盖
  keep_latest: 5          # 轮

# ==================== 路径配置 ====================
paths:
  # 外部测试数据文件路径（如 shapeTestdata.xlsx），空则跳过相关用例
  shape_data: ""

# ==================== Driver 配置 ====================
driver:
  # session 连续失败 N 次后终止测试，避免无限重试
  failure_threshold: 3    # 次

# ==================== 缓存配置 ====================
cache:
  # 本地缓存有效期，超期后优先从云端刷新
  max_age_seconds: 86400  # 秒，默认 24 小时

  # 缓存文件目录（相对于 boox_automation/）
  dir: "data/.cache"

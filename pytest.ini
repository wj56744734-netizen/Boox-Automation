[pytest]
; 将项目根目录加入 sys.path
pythonpath = .

; 实时输出（禁用捕获，所有日志流式显示）
addopts = --tb=short --reruns 2

; 统一日志配置 - 实时输出 + 自定义格式
log_cli = true
log_cli_level = info
log_cli_format = %(asctime)s  %(levelname)-5s  %(message)s
log_cli_date_format = %H:%M:%S

; 日志文件配置（需要创建 logs 目录后启用）
; log_file = logs/test.log
; log_file_level = DEBUG
; log_file_format = %(asctime)s [%(levelname)s] | %(name)s | %(funcName)s | %(message)s
; log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    test: 自定义的通用测试标记说明
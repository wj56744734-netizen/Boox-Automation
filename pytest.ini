[pytest]
; 将项目根目录加入 sys.path，确保模块导入路径正确
pythonpath = .

addopts = --tb=short --disable-warnings
; 禁用测试ID中的非ASCII字符转义，使中文用例名正常显示
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

; 统一日志配置 - 实时输出 + 自定义格式
log_cli = true
log_cli_level = info
log_cli_format = %(asctime)s  %(levelname)-5s  %(message)s
log_cli_date_format = %H:%M:%S

; 日志文件配置（需要先创建 logs 目录再启用）
; log_file = logs/test.log
; log_file_level = DEBUG
; log_file_format = %(asctime)s [%(levelname)s] | %(name)s | %(funcName)s | %(message)s
; log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    test: 自定义的通用测试标记说明